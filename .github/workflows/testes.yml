name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar testes com Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser
          Invoke-Pester -Path ./tests -Output Detailed -CI
